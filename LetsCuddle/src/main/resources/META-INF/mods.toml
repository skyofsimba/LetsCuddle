# mods.toml —— Forge 1.20.1 元数据（对应原工程的 neoforge.mods.toml）
modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
logoFile = "hug_ticket.png"

# ---- 依赖 ----
[[dependencies."${mod_id}"]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# playerAnimator 的 modid 是 playeranimator（Fabric 侧才叫 player-animator）。
# side=CLIENT：专用服务端不强制安装它，只有客户端需要。
[[dependencies."${mod_id}"]]
modId = "playeranimator"
mandatory = true
versionRange = "[1.0.2-rc1+1.20,)"
ordering = "NONE"
side = "CLIENT"
