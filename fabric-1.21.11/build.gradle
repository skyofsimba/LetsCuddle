plugins {
    // 1.21.11 仍是混淆版本，用 -remap 变体；26.x 起才换成 net.fabricmc.fabric-loom。
    // loom 版本不能写进 gradle.properties（plugins 块不插值），改版本就改这一行。
    id 'net.fabricmc.fabric-loom-remap' version '1.17.20'
    id 'maven-publish'
}

group = mod_group_id
version = mod_version

base {
    archivesName = "letscuddle-${minecraft_version}-fabric"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "letscuddle" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    // 打开 Camera#setPos(Vec3d)：第三人称镜头要跟着贴贴模型偏移
    accessWidenerPath = file('src/main/resources/letscuddle.accesswidener')
}

repositories {
    // PAL（Player Animation Library，playerAnimator 的继任者）的发布仓库
    maven {
        name = 'Redlance'
        url = 'https://repo.redlance.org/public'
        content {
            includeGroup 'com.zigythebird.playeranim'
            includeGroup 'org.redlance.mochafloats'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"

    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // 动画后端：与 1.20.1 的 playerAnimator 对应。modImplementation 会把它 remap 到本工程的 Yarn 映射。
    modImplementation "com.zigythebird.playeranim:PlayerAnimationLibFabric:${pal_version}"
}

// common/ 是无构建文件的纯 Java 源目录：只编进 main，client source set 通过 main 的类路径使用
sourceSets.main.java.srcDir '../common/src/main/java'
sourceSets.main.resources.srcDir '../common/src/main/resources'

tasks.named('processResources', ProcessResources).configure {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }

    // 动画 JSON 在中性目录 anim/raw 维护，构建时映射到 PAL 约定目录 player_animations/
    from('../common/src/main/resources/anim/raw') {
        into 'assets/letscuddle/player_animations'
    }
    exclude 'anim/**'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
