plugins {
    // 1.21.11 仍是混淆版本，用 -remap 变体；26.x 起才换成 net.fabricmc.fabric-loom。
    // loom 版本不能写进 gradle.properties（plugins 块不插值），改版本就改这一行。
    id 'net.fabricmc.fabric-loom-remap' version '1.17.20'
    id 'maven-publish'
}

group = mod_group_id
version = mod_version

base {
    archivesName = "letscuddle-${minecraft_version}-fabric"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "letscuddle" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    // 打开 Camera#setPos(Vec3d)：第三人称镜头要跟着贴贴模型偏移
    accessWidenerPath = file('src/main/resources/letscuddle.accesswidener')
}

repositories {
    // loom 自动加 Fabric maven；mavenCentral 供通用依赖，
    // Sponge 仓库是 sponge-mixin 的上游（离线构建时 Gradle 按仓库分别缓存元数据）。
    mavenCentral()
    maven {
        name = 'Sponge'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"

    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

// 本工程不使用 MixinExtras；开发环境离线时取不到它的 fabric 产物，直接从依赖图里摘掉。
// sponge-mixin 固定在构建机上可离线解析的版本（API 与 loader 声明的一致）。
configurations.configureEach {
    exclude group: 'io.github.llamalad7'
    resolutionStrategy.force 'net.fabricmc:sponge-mixin:0.16.4+mixin.0.8.7'
}

// common/ 是无构建文件的纯 Java 源目录：只编进 main，client source set 通过 main 的类路径使用
sourceSets.main.java.srcDir '../common/src/main/java'
sourceSets.main.resources.srcDir '../common/src/main/resources'

tasks.named('processResources', ProcessResources).configure {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }

    // 动画 JSON 在中性目录 anim/raw 维护，构建时映射到 PAL 约定目录 player_animations/
    from('../common/src/main/resources/anim/raw') {
        into 'assets/letscuddle/player_animations'
    }
    exclude 'anim/**'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
